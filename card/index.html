<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elliot Langham — Kept</title>
<meta name="description" content="Elliot Langham, Founder of Kept — software for lawn & garden businesses. Save my contact, try the live demo, or visit the site.">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta property="og:title" content="Elliot Langham — Kept">
<meta property="og:description" content="Software for lawn & garden businesses — quoting, scheduling and invoicing in one app.">
<meta property="og:image" content="../icons/icon-512.png">
<meta property="og:type" content="profile">
<link rel="canonical" href="https://software.lawnenvyaustralia.com/card/">
<style>
:root{
  --green-900:#123D14;
  --green-700:#1E5C22;
  --green-600:#2B802C;
  --green-500:#3B9A3C;
  --lime:#9BE15D;
  --paper:#F7FAF4;
  --ink:#132015;
  --ink-soft:#3E4F41;
  --white:#ffffff;
  --line:#DCE6D8;
  --radius:14px;
  --shadow:0 10px 30px rgba(18,61,20,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Archivo',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--paper);line-height:1.55}
img{max-width:100%;display:block}
a{color:inherit}
@media (prefers-color-scheme: dark){
  :root{--paper:#0F1A10;--ink:#EAF3E7;--ink-soft:#AEC2AA;--white:#16241A;--line:#25391F;--shadow:0 10px 30px rgba(0,0,0,.4)}
}

.btn{display:inline-block;border:0;cursor:pointer;text-decoration:none;text-align:center;font-family:inherit;font-weight:800;font-size:1rem;padding:13px 24px;border-radius:999px;background:var(--green-600);color:#fff;box-shadow:0 6px 18px rgba(43,128,44,.3);transition:transform .15s,background .15s}
.btn:hover{background:var(--green-700);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--green-700);box-shadow:inset 0 0 0 2px var(--green-600)}
.btn-block{display:block;text-align:center}

body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.card{width:100%;max-width:380px;background:var(--white);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:36px 28px 28px;text-align:center}
.mark{width:76px;height:76px;margin:0 auto 18px;border-radius:18px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain}
.wordmark{font-weight:900;font-size:1.3rem;color:var(--green-700);letter-spacing:-.01em}
.tagline{font-size:.85rem;color:var(--ink-soft);margin-top:4px}
.who{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.name{font-weight:800;font-size:1.15rem}
.role{font-size:.88rem;color:var(--ink-soft);margin-top:2px}
.actions{margin-top:22px;display:grid;gap:10px}
.actions .btn{display:flex;align-items:center;justify-content:center;gap:8px}
.actions .btn svg{width:18px;height:18px;flex:none}
.pricing{margin-top:22px;font-size:.78rem;color:var(--ink-soft)}
.pricing strong{color:var(--green-600)}
.footer-note{margin-top:14px;font-size:.72rem;color:var(--ink-soft);opacity:.75}
</style>
</head>
<body>
<div class="card">
  <div class="mark"><img src="../icons/logo_trim.png" alt="Kept"></div>
  <div class="wordmark">Kept</div>
  <div class="tagline">Software for service &amp; trade businesses</div>

  <div class="who">
    <div class="name">Elliot Langham</div>
    <div class="role">Founder, Kept</div>
  </div>

  <div class="actions">
    <a class="btn" href="card.vcf" download="Elliot Langham - Kept.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Add to contacts
    </a>
    <a class="btn btn-ghost" href="mailto:elliot@lawn-envy.net">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 6l8 7 8-7"/></svg>
      Email me
    </a>
    <a class="btn btn-ghost" href="https://jobs.lawnenvyaustralia.com/?demo=1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg>
      Try the live demo
    </a>
    <a class="btn btn-ghost" href="https://software.lawnenvyaustralia.com/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18 14 14 0 010-18z"/></svg>
      Visit the website
    </a>
  </div>

  <div class="pricing">Quoting, scheduling &amp; invoicing in one app — <strong>from $55/mo</strong>, flat per business.</div>
  <div class="footer-note">software.lawnenvyaustralia.com</div>
</div>
</body>
</html>
