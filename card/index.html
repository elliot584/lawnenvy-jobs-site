<style>
:root{
  --green-900:#1B2333;
  --green-700:#2E4165;
  --green-600:#3E5C8A;
  --green-500:#7C9CC4;
  --lime:#C7A76B;
  --paper:#F4F3EE;
  --ink:#20242E;
  --ink-soft:#525B6B;
  --white:#ffffff;
  --line:#DCDFE6;
  --radius:14px;
  --shadow:0 10px 30px rgba(27,35,51,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--paper);line-height:1.6}
img{max-width:100%;display:block}
a{color:inherit}
@media (prefers-color-scheme: dark){
  :root{--paper:#10151F;--ink:#E8ECF3;--ink-soft:#A9B4C8;--white:#161C2A;--line:#232B3D;--shadow:0 10px 30px rgba(0,0,0,.4)}
}

.btn{display:inline-block;border:0;cursor:pointer;text-decoration:none;text-align:center;font-family:inherit;font-weight:600;font-size:1rem;padding:13px 24px;border-radius:999px;background:var(--green-600);color:#fff;box-shadow:0 6px 18px rgba(27,35,51,.18);transition:transform .15s,background .15s}
.btn:hover{background:var(--green-700);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--green-700);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-block{display:block;text-align:center}

body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.card{width:100%;max-width:380px;background:var(--white);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:36px 28px 28px;text-align:center}
.wordmark{font-weight:300;font-size:1.6rem;letter-spacing:3px;text-transform:lowercase;color:var(--ink);display:flex;align-items:baseline;justify-content:center;gap:6px}
.wordmark .dot{width:12px;height:12px;display:inline-block;transform:translateY(-9px);object-fit:contain}
.tagline{font-size:.85rem;color:var(--ink-soft);margin-top:8px}
.who{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.name{font-weight:700;font-size:1.15rem}
.role{font-size:.88rem;color:var(--ink-soft);margin-top:2px}
.actions{margin-top:22px;display:grid;gap:10px}
.actions .btn{display:flex;align-items:center;justify-content:center;gap:8px}
.actions .btn svg{width:18px;height:18px;flex:none}
.pricing{margin-top:22px;font-size:.78rem;color:var(--ink-soft)}
.pricing strong{color:var(--green-600)}
.footer-note{margin-top:14px;font-size:.72rem;color:var(--ink-soft);opacity:.75}
</style>
</head>

  </div>

      Add to contacts
    </a>
    <a class="btn btn-ghost" href="mailto:elliot@keptsoftware.com.au">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 6l8 7 8-7"/></svg>
      Email me
    </a>
    <a class="btn btn-ghost" href="https://app.keptsoftware.com.au/?demo=1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg>
      Try the live demo
    </a>
    <a class="btn btn-ghost" href="https://www.keptsoftware.com.au/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18 14 14 0 010-18z"/></svg>
      Visit the website
    </a>

  <div class="pricing">Quoting, scheduling &amp; invoicing in one app — <strong>from $69/mo + GST</strong>, flat per business.</div>
  <div class="footer-note">www.keptsoftware.com.au</div>
</div>
